<!DOCTYPE html>
<html lang="en" class="device-desktop">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <title>Add {{APP_NAME}} to your Home Screen</title>
    <link rel="manifest" href="/__grok/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
  </head>
  <body style="margin:0;background:#000;color:#fff;font:16px/1.5 system-ui,sans-serif">
    <main style="min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center">
      <section>
        <h1>Add {{APP_NAME}} to your Home Screen</h1>
        <p>Open this link on your iPhone or iPad, then use Share → Add to Home Screen.</p>
        <p><a href="{{APP_URL}}" style="color:#fff">Open {{APP_NAME}}</a></p>
      </section>
    </main>
  </body>
</html>
